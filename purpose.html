<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindBloom | Sense of Purpose</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">

        <p class="section">Section 5 of 8</p>

        <h1>Sense of Purpose</h1>

        <p class="subtitle">
            How motivated and directed your days have felt over the past two weeks.
        </p>

        <form onsubmit="event.preventDefault(); saveAnswers('purpose','pressure.html');">

            <label>1. My day-to-day has felt like it has a clear direction.</label>
            <select required>
                <option value="">Choose how often...</option>
                <option value="0">Never</option>
                <option value="1">Rarely</option>
                <option value="2">Sometimes</option>
                <option value="3">Often</option>
                <option value="4">Always</option>
            </select>

            <label>2. I've struggled to find motivation to start or finish things.</label>
            <select required>
                <option value="">Choose how often...</option>
                <option value="4">Never</option>
                <option value="3">Rarely</option>
                <option value="2">Sometimes</option>
                <option value="1">Often</option>
                <option value="0">Always</option>
            </select>

            <label>3. I've felt like what I do actually matters.</label>
            <select required>
                <option value="">Choose how often...</option>
                <option value="0">Never</option>
                <option value="1">Rarely</option>
                <option value="2">Sometimes</option>
                <option value="3">Often</option>
                <option value="4">Always</option>
            </select>

            <label>4. I've felt aimless, like I'm just going through the motions.</label>
            <select required>
                <option value="">Choose how often...</option>
                <option value="4">Never</option>
                <option value="3">Rarely</option>
                <option value="2">Sometimes</option>
                <option value="1">Often</option>
                <option value="0">Always</option>
            </select>

            <button type="submit" class="btn">
                Next →
            </button>

        </form>
        <script src="script.js"></script>

    </div>

</body>

</html>
