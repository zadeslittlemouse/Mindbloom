<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindBloom | Gratitude & Resilience</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">

        <p class="section">Section 7 of 8</p>

        <h1>Gratitude & Resilience</h1>

        <p class="subtitle">
            How you've bounced back from setbacks and noticed the good things in life over the past two weeks.
        </p>

        <form onsubmit="event.preventDefault(); saveAnswers('resilience','energy.html');">

            <label>1. I've noticed and appreciated small good things during my day.</label>
            <select required>
                <option value="">Choose how often...</option>
                <option value="0">Never</option>
                <option value="1">Rarely</option>
                <option value="2">Sometimes</option>
                <option value="3">Often</option>
                <option value="4">Always</option>
            </select>

            <label>2. When something's gone wrong, I've been able to bounce back.</label>
            <select required>
                <option value="">Choose how often...</option>
                <option value="0">Never</option>
                <option value="1">Rarely</option>
                <option value="2">Sometimes</option>
                <option value="3">Often</option>
                <option value="4">Always</option>
            </select>

            <label>3. Setbacks have felt like they derail me completely.</label>
            <select required>
                <option value="">Choose how often...</option>
                <option value="4">Never</option>
                <option value="3">Rarely</option>
                <option value="2">Sometimes</option>
                <option value="1">Often</option>
                <option value="0">Always</option>
            </select>

            <label>4. I've found it easy to feel thankful, even on hard days.</label>
            <select required>
                <option value="">Choose how often...</option>
                <option value="0">Never</option>
                <option value="1">Rarely</option>
                <option value="2">Sometimes</option>
                <option value="3">Often</option>
                <option value="4">Always</option>
            </select>

            <button type="submit" class="btn">
                Next →
            </button>

        </form>
        <script src="script.js"></script>

    </div>

</body>

</html>
