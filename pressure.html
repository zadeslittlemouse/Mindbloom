<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindBloom | Work / Study Pressure</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">

        <p class="section">Section 6 of 8</p>

        <h1>Work / Study Pressure</h1>

        <p class="subtitle">
            How manageable the demands on your time have felt over the past two weeks.
        </p>

        <form onsubmit="event.preventDefault(); saveAnswers('pressure','resilience.html');">

            <label>1. Work or study has felt manageable rather than overwhelming.</label>
            <select required>
                <option value="">Choose how often...</option>
                <option value="0">Never</option>
                <option value="1">Rarely</option>
                <option value="2">Sometimes</option>
                <option value="3">Often</option>
                <option value="4">Always</option>
            </select>

            <label>2. There's never felt like enough time to get things done.</label>
            <select required>
                <option value="">Choose how often...</option>
                <option value="4">Never</option>
                <option value="3">Rarely</option>
                <option value="2">Sometimes</option>
                <option value="1">Often</option>
                <option value="0">Always</option>
            </select>

            <label>3. I've been able to switch off from work or study when I need to.</label>
            <select required>
                <option value="">Choose how often...</option>
                <option value="0">Never</option>
                <option value="1">Rarely</option>
                <option value="2">Sometimes</option>
                <option value="3">Often</option>
                <option value="4">Always</option>
            </select>

            <label>4. I've dreaded starting my day because of work or study demands.</label>
            <select required>
                <option value="">Choose how often...</option>
                <option value="4">Never</option>
                <option value="3">Rarely</option>
                <option value="2">Sometimes</option>
                <option value="1">Often</option>
                <option value="0">Always</option>
            </select>

            <button type="submit" class="btn">
                Next →
            </button>

        </form>
        <script src="script.js"></script>

    </div>

</body>

</html>
